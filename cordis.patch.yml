# dsh-block-placeholder-edits: block placeholder-comment edits and large silent deletions.
# To change settings, add a row like the one below to
# ~/.dsh/profiles/<profile>/cordis.patch.yml (one profile) or ~/.dsh/cordis.patch.yml
# (every profile). Keys you leave out keep their defaults.
#
# - id: block-placeholder-edits
#   config:
#     mode: deny               # or ask
#     shrinkRatio: 0.5         # 0 disables the large-deletion check
#     minLinesForShrink: 40
#     allowIdenticalRetry: true
#     extraPatterns: []
#     ignore: ['docs/**']
- insert:
    - id: block-placeholder-edits
      name: dsh-block-placeholder-edits
